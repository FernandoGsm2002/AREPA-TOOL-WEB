<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - ArepaTool</title>
    <link rel="icon" type="image/x-icon" href="pngs/logo.ico">
    <link rel="stylesheet" href="css/skeleton-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card animate-fade-in">
            <div class="text-center mb-4">
                <a href="index.html" class="auth-brand"><img src="pngs/arepalanding.png" alt="ArepaTool"></a>
                <h3>Nueva Contraseña</h3>
                <p class="text-subtle">Crea una contraseña segura</p>
            </div>

            <!-- Loading -->
            <div id="loadingSection" class="text-center py-5">
                <div class="spinner-border text-primary-500" style="width: 3rem; height: 3rem;"></div>
                <p class="mt-2 text-subtle">Validando token...</p>
            </div>

            <!-- Error -->
            <div id="errorSection" class="hidden text-center">
                <div class="alert alert-error">
                    <i class="bi bi-x-circle"></i> <span id="errorMsg">Link inválido</span>
                </div>
                <a href="forgot-password.html" class="btn btn-outline btn-sm mt-3">Solicitar nuevo link</a>
            </div>

            <!-- Success -->
            <div id="successSection" class="hidden text-center">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle"></i> <span>¡Contraseña Actualizada!</span>
                </div>
                <p class="text-subtle text-sm mt-2">Redirigiendo al inicio...</p>
            </div>

            <!-- Form -->
            <form id="resetForm" class="hidden">
                <div class="form-group">
                    <label class="form-label">Nueva Contraseña</label>
                    <div class="input-group">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Contraseña</label>
                    <div class="input-group">
                        <i class="bi bi-lock-fill"></i>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Repite la contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <i class="bi bi-check-lg"></i> Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api2.arepatool.com';

        const loading = document.getElementById('loadingSection');
        const errorSec = document.getElementById('errorSection');
        const form = document.getElementById('resetForm');
        const successSec = document.getElementById('successSection');
        const submitBtn = document.getElementById('submitBtn');

        const token = new URLSearchParams(window.location.search).get('token');

        loading.classList.add('hidden');
        if (token) {
            form.classList.remove('hidden');
        } else {
            errorSec.classList.remove('hidden');
            document.getElementById('errorMsg').textContent = 'El link es inválido o ha expirado.';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1.length < 6) return alert('Mínimo 6 caracteres');
            if (p1 !== p2) return alert('Las contraseñas no coinciden');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const res = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: p1 })
                });
                const data = await res.json();

                if (!data.success) {
                    alert('Error: ' + (data.error || 'No se pudo actualizar la contraseña'));
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Guardar Cambios';
                    return;
                }

                form.classList.add('hidden');
                successSec.classList.remove('hidden');
                setTimeout(() => window.location.href = 'index.html', 3000);
            } catch (err) {
                alert('Error de red');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar Cambios';
            }
        });
    </script>
</body>
</html>
